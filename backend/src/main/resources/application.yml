spring:
  application:
    name: indexx-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/indexx}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
server.port: ${SERVER_PORT:8080}
